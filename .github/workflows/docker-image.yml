name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from package.json
        id: extract-version
        run: |
          VERSION=$(jq -r '.version' ./backend/package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build the Docker image
        id: build-image
        run: |
          docker build ./backend -f ./backend/Dockerfile -t fbansept/poc-api-design:${{ steps.extract-version.outputs.VERSION }}
          docker image tag fbansept/poc-api-design:${{ steps.extract-version.outputs.VERSION }} fbansept/poc-api-design:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fbansept
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push the Docker images
        run: |
          docker push fbansept/poc-api-design:${{ steps.extract-version.outputs.VERSION }}
          docker push fbansept/poc-api-design:latest
