name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        id: build-image
        run: |
          TIMESTAMP=$(date +%s)
          docker build ./backend -f ./backend/Dockerfile -t fbansept/poc-api-design:$TIMESTAMP
          docker image tag fbansept/poc-api-design:$TIMESTAMP fbansept/poc-api-design:latest
          echo "IMAGE_TAG=fbansept/poc-api-design:$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: fbansept
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push the Docker image
        run: docker push ${{ steps.build-image.outputs.IMAGE_TAG }}

      - name: Push the Docker image latest tag
        run: docker push fbansept/poc-api-design:latest
