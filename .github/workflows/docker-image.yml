name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build ./backend --file Dockerfile --tag fbansept/poc-api-design:$(date +%s)

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
         username: fbansept
         password: ${{ secrets.DOCKER_PASSWORD }} 

    - name: Push the Docker image
      run: docker push fbansept/poc-api-design:$(date +%s)
