events {
    worker_connections 1024;
}

http {
    # Zone de limitation des requêtes (2 requêtes/seconde)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=2r/s;

    upstream backend_upstream {
        server backend:3000;
    }

    server {
        listen 80;
        server_name monsite.com localhost;

        location /api/ {
            # Limite les requêtes à 2/s avec un burst de 4 (file d'attente)
            limit_req zone=api_limit burst=4;

            # Renvoie un code 429 sans contenu HTML
            limit_req_status 429;

            # Définit un message d'erreur personnalisé pour le code 429
            error_page 429 = @too_many_requests;

            # En-têtes CORS
            add_header 'Access-Control-Allow-Origin' 'http://monsite.com' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Location pour gérer les erreurs 429
        location @too_many_requests {
            # Renvoie une réponse texte brute
            default_type text/plain;
            return 429 "Too many requests";
        }

        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
        }
    }
}
